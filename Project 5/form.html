<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Forms Example</title>
  </head>
  <body>
    <h1>HTML Form Example</h1>

    <form action="#" method="post">
      <fieldset>
        <legend>Personal Information</legend>

        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" /><br /><br />

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" /><br /><br />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" /><br /><br />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" /><br /><br />

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" /><br /><br />

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" /><br /><br />

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" /><br /><br />

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" /><br /><br />

        <label for="datetime">Date & Time:</label>
        <input
          type="datetime-local"
          id="datetime"
          name="datetime"
        /><br /><br />

        <label for="month">Month:</label>
        <input type="month" id="month" name="month" /><br /><br />

        <label for="week">Week:</label>
        <input type="week" id="week" name="week" /><br /><br />
      </fieldset>

      <br />

      <fieldset>
        <legend>Gender</legend>

        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other" />
        <label for="other">Other</label>
      </fieldset>

      <br />

      <fieldset>
        <legend>Skills</legend>

        <input type="checkbox" id="html" name="skill" value="HTML" />
        <label for="html">HTML</label><br />

        <input type="checkbox" id="css" name="skill" value="CSS" />
        <label for="css">CSS</label><br />

        <input type="checkbox" id="js" name="skill" value="JavaScript" />
        <label for="js">JavaScript</label><br />

        <input type="checkbox" id="python" name="skill" value="Python" />
        <label for="python">Python</label>
      </fieldset>

      <br />

      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="">--Select Country--</option>
        <option>India</option>
        <option>USA</option>
        <option>Canada</option>
        <option>Australia</option>
      </select>

      <br /><br />

      <label for="city">City:</label>

      <input list="cities" id="city" name="city" />

      <datalist id="cities">
        <option value="Bangalore"></option>
        <option value="Chennai"></option>
        <option value="Hyderabad"></option>
        <option value="Mumbai"></option>
      </datalist>

      <br /><br />

      <label for="address">Address:</label><br />

      <textarea id="address" rows="5" cols="40"></textarea>

      <br /><br />

      <label for="color">Favorite Color:</label>
      <input type="color" id="color" /><br /><br />

      <label for="range">Experience:</label>
      <input type="range" min="0" max="10" /><br /><br />

      <label for="file">Upload File:</label>
      <input type="file" id="file" /><br /><br />

      <label for="url">Website:</label>
      <input type="url" id="url" /><br /><br />

      <label for="search">Search:</label>
      <input type="search" id="search" /><br /><br />

      <label for="image">Image Button:</label><br />
      <input
        type="image"
        src="submit.png"
        alt="Submit"
        width="100"
      /><br /><br />

      <input type="hidden" name="userid" value="101" />

      <input type="submit" value="Submit" />

      <input type="reset" value="Reset" />

      <input type="button" value="Click Me" />
    </form>
  </body>
</html>
